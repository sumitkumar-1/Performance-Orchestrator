<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Performance Orchestrator</title>
    <link rel="icon" type="image/png" href="/images/global-relay-icon.png" />
    <link rel="stylesheet" href="/css/app.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" href="#dashboard">
        <img class="brand-icon global-relay-icon" src="/images/global-relay-icon.png" alt="" />
        <span>Global Relay<br /><small>Performance orchestrator</small></span>
      </a>
      <nav aria-label="Main navigation">
        <a href="#dashboard">Overview</a><a href="#configure">Configure a run</a
        ><a href="#history">Run history</a><a href="#settings">Connections & catalog</a>
      </nav>
      <div class="sidebar-bottom">
        <span class="dot"></span> Local workspace
        <p id="workspace-mode">Loading mode…</p>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <span>Engineering / Performance</span><span class="pill" id="mode-badge">LOADING</span>
      </header>
      <main id="app" tabindex="-1"></main>
      <div id="notice" role="status" aria-live="polite"></div>
    </div>
    <template id="loading"><p class="muted">Loading workspace…</p></template>
  </body>
</html>
