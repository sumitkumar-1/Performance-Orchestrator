server:
  address: 127.0.0.1
  port: 8080
  error:
    include-message: never
spring:
  profiles:
    active: ${orchestrator.mode:simulation}
  datasource:
    url: jdbc:h2:file:./data/orchestrator;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
  servlet:
    multipart:
      enabled: false
orchestrator:
  mode: simulation
  catalog: classpath:mocks/catalog.yaml
  connections: classpath:config/connections.yaml
  configuration-file: data/configuration.json
  artifact-root: data/artifacts
  tick-ms: 1200
  worker-enabled: true
