# Local quick start: ./scripts/run-local.sh build-run
# Application configuration sections below contain examples for every environment.
# target-environment selects the initial/default environment. Replace example URLs, secret IDs and repository paths.
# Existing dashboard overrides may hide defaults: load startup defaults and save to reset.
# Image mappings are configured per service.
server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      persistent: false # Integration credentials and vault tokens stay in memory
      timeout: 30m # Idle browser sessions destroy retained credentials
  error:
    include-message: never
spring:
  datasource:
    url: jdbc:h2:file:./data/real/orchestrator;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: '' # Embedded H2 pilot default; no database secret provisioning yet
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
  servlet:
    multipart:
      enabled: false
orchestrator:
  diagnostics:
    enabled: false # Enable recording and optional run/monitoring diagnostic consoles; restart to apply
  execution:
    enabled: false # Opt in after reviewing the target cluster and service Helm settings
    kube-context: '' # Explicit local context, or in-cluster on CKP
    expected-api-server: '' # Exact HTTPS server URL; prevents use of an unintended context
    # Per-environment targets. Replace API hosts with `kubectl config view` values.
    # Legacy kube-context/expected-api-server above override the default environment only.
    targets:
      sandbox:
        kube-context: sandbox-nvan
        expected-api-server: https://api.ckp-sandbox-region.domain:6443
      dev:
        kube-context: dev-nvan
        expected-api-server: https://api.ckp-dev-region.domain:6443
      qa:
        kube-context: qa-nvan
        expected-api-server: https://api.ckp-qa-region.domain:6443
      stable:
        kube-context: stable-nvan
        expected-api-server: https://api.ckp-stable-region.domain:6443
      perf:
        kube-context: perf-nvan
        expected-api-server: https://api.ckp-perf-region.domain:6443
      perf3:
        kube-context: perf3-nvan
        expected-api-server: https://api.ckp-perf3-region.domain:6443
    workspace: data/real/workspaces
    preparation-concurrency: 3 # Parallel service reviews (1–8); deployment order is unchanged
    command-timeout-seconds: 300 # Per Helm operation; 10–1800 seconds
    default-run-duration-seconds: 900 # Initial overall timeout for new run profiles
    max-run-duration-seconds: 28800 # Maximum overall timeout selectable per run
    helm-repository-connection: office # Existing Artifactory connection; blank for anonymous repositories
    helm-repository-username: '' # Token owner's short username; blank derives it from the current AD login
    # Chart.yaml aliases, e.g. repository: '@helm-release-virtual'. Replace the example host.
    helm-repositories:
      helm-dev-virtual: https://artifactory.domain/artifactory/helm-dev-virtual
      helm-qa-virtual: https://artifactory.domain/artifactory/helm-qa-virtual
      helm-stable-virtual: https://artifactory.domain/artifactory/helm-stable-virtual
      helm-release-virtual: https://artifactory.domain/artifactory/helm-release-virtual
  target-environment: sandbox # Default selection; each run chooses and pins its own target
  catalog: ''
  connections: '' # External bootstrap file overrides connection-defaults below
  catalog-defaults:
    # EXAMPLES: replace cluster identities, namespaces and paths before use.
    # clusterIdentity is the CKP subdomain (no scheme); defaults both clusterSubdomain Helm values.
    environments:
      sandbox:
        displayName: sandbox (example - configure before use)
        clusterIdentity: ckp-sandbox-region.domain
        monitoring:
          connectionRef: lower
      dev:
        displayName: dev (example - configure before use)
        clusterIdentity: ckp-dev-region.domain
        monitoring:
          connectionRef: lower
      qa:
        displayName: qa (example - configure before use)
        clusterIdentity: ckp-qa-region.domain
        monitoring:
          connectionRef: lower
      stable:
        displayName: stable (example - configure before use)
        clusterIdentity: ckp-stable-region.domain
        monitoring:
          connectionRef: higher
      perf:
        displayName: perf (example - configure before use)
        clusterIdentity: ckp-perf-region.domain
        monitoring:
          connectionRef: higher
      perf3:
        displayName: perf3 (example - configure before use)
        clusterIdentity: ckp-perf3-region.domain
        monitoring:
          connectionRef: higher
    services:
      ps-spoolers-ps-load-gen:
        projectPath: projects/ps-spoolers-ps-load-gen
        monitoringCredentials:
          sandbox: sandbox-logs
          dev: dev-logs
          qa: qa-logs
          stable: stable-logs
          perf: perf-logs
          perf3: perf3-logs
        containerImage:
          connectionRef: office
          repoStage: dev # Produces docker-dev; independent of deployment environment
          teamId: ps-spoolers
          imageName: ps-spoolers-ps-load-gen
        sourceProject:
          connectionRef: office-stash
          projectKey: SP
          repository: ps-spoolers-ps-load-gen
          revision: REPLACE_WITH_APPROVED_GIT_TAG
          chartPath: ckp/helm/ps-spoolers-ps-load-gen

        deploymentDefaults:
          namespace: ps-spoolers-smtp-data-producer
          releaseName: ps-spoolers-load-gen
          valuesFiles: [ckp/helm/ps-spoolers-ps-load-gen/values.yaml]
        # Optional per-environment exceptions; otherwise deploymentDefaults apply.
        deploymentByEnvironment: {}

    scenarios:
      baseline-example:
        displayName: Baseline (example - configure before use)
        revision: example-1

        defaults:
          profilePath: ckp/helm/ps-spoolers-ps-load-gen/values.yaml
          note: Replace with approved load-profile fields; this is not an executable profile
  # Sanitized organization patterns, not verified destinations. No automatic requests.
  connection-defaults:
    loki:
      lower:
        apiBaseUrl: https://logs.dev-domain/loki/api/v1 # EXAMPLE shared lower environments
      higher:
        apiBaseUrl: https://logs.perf-domain/loki/api/v1 # EXAMPLE shared higher environments
    artifactory:
      office:
        apiBaseUrl: https://artifactory.domain/artifactory/api/docker
        authMode: token # Paste an access token in the connection session
    bitbucket:
      office-stash:
        apiBaseUrl: https://stash.domain.net/rest/api
        authMode: token
    secretServers:
      office-vault:
        apiBaseUrl: https://domain/SecretServer/api/v1
        authMode: interactive
        tokenUrl: https://domain/SecretServer/oauth2/token
    credentials:
      bitbucket-reader:
        provider: delinea
        secretServerRef: office-vault
        secretId: '12346' # EXAMPLE: replace with the approved Bitbucket secret ID
        tokenFieldSlug: token
      registry-reader:
        provider: delinea
        secretServerRef: office-vault
        secretId: '12345' # EXAMPLE ONLY: replace with the approved registry secret ID
        tokenFieldSlug: token
      sandbox-logs:
        provider: delinea
        secretServerRef: office-vault
        secretId: '20000' # EXAMPLE ONLY: replace for sandbox logs
        usernameFieldSlug: username
        passwordFieldSlug: password
      dev-logs:
        provider: delinea
        secretServerRef: office-vault
        secretId: '20002' # EXAMPLE ONLY: replace for dev logs
        usernameFieldSlug: username
        passwordFieldSlug: password
      qa-logs:
        provider: delinea
        secretServerRef: office-vault
        secretId: '20004' # EXAMPLE ONLY: replace for qa logs
        usernameFieldSlug: username
        passwordFieldSlug: password
      stable-logs:
        provider: delinea
        secretServerRef: office-vault
        secretId: '20006' # EXAMPLE ONLY: replace for stable logs
        usernameFieldSlug: username
        passwordFieldSlug: password
      perf-logs:
        provider: delinea
        secretServerRef: office-vault
        secretId: '20008' # EXAMPLE ONLY: replace for perf logs
        usernameFieldSlug: username
        passwordFieldSlug: password
      perf3-logs:
        provider: delinea
        secretServerRef: office-vault
        secretId: '20010' # EXAMPLE ONLY: replace for perf3 logs
        usernameFieldSlug: username
        passwordFieldSlug: password
    imageSources: {} # Legacy mappings remain importable; new mappings belong to services
  configuration-file: data/real/configuration.json
  artifact-root: data/real/artifacts
  tick-ms: 1200
