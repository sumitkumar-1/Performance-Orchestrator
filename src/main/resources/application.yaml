# Local real-mode quick start: ./scripts/run-local.sh build-run --mode real
# All seven editable real-mode sections below contain examples. Only the selected
# target-environment is shown. Replace example URLs, secret IDs and repository paths.
# Existing dashboard overrides may hide defaults: load startup defaults and save to reset.
# Empty optional exception/override lists are intentional; simulation-only imageSources
# are supplied by mocks and are not the real Artifactory source map below.
server:
  address: 127.0.0.1
  port: 8080
  error:
    include-message: never
spring:
  profiles:
    active: ${orchestrator.mode:simulation}
  datasource:
    url: jdbc:h2:file:./data/orchestrator;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: '' # Embedded H2 pilot default; no database secret provisioning yet
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
  servlet:
    multipart:
      enabled: false
orchestrator:
  mode: simulation
  target-environment: sandbox # Real-mode instance binding; fixed until restart
  catalog: classpath:mocks/catalog.yaml
  connections: '' # External bootstrap file overrides connection-defaults below
  # Real catalog sections; supply organization mappings here or via external Spring YAML.
  # Simulation uses the separate mock catalog selected above.
  catalog-defaults:
    # EXAMPLES: replace cluster identities, namespaces and paths before use.
    environments:
      sandbox:
        displayName: sandbox (example - configure before use)
        clusterIdentity: ckp-sandbox-region.domain
        monitoring: # Metadata only; live monitoring adapters are not connected yet
          logsApiBaseUrl: https://logs.sandbox-domain/loki/api/v1
          metricsApiBaseUrl: https://metrics-sandbox.example.invalid/api/v1 # PLACEHOLDER: confirm endpoint, not inferred from Loki
          namespaceCredentials:
            ps-spoolers-smtp-data-producer:
              logsCredentialRef: sandbox-logs
              metricsCredentialRef: sandbox-metrics
      dev:
        displayName: dev (example - configure before use)
        clusterIdentity: ckp-dev-region.domain
        monitoring: # Metadata only; live monitoring adapters are not connected yet
          logsApiBaseUrl: https://logs.dev-domain/loki/api/v1
          metricsApiBaseUrl: https://metrics-dev.example.invalid/api/v1 # PLACEHOLDER: confirm endpoint, not inferred from Loki
          namespaceCredentials:
            ps-spoolers-smtp-data-producer:
              logsCredentialRef: dev-logs
              metricsCredentialRef: dev-metrics
      qa:
        displayName: qa (example - configure before use)
        clusterIdentity: ckp-qa-region.domain
        monitoring: # Metadata only; live monitoring adapters are not connected yet
          logsApiBaseUrl: https://logs.qa-domain/loki/api/v1
          metricsApiBaseUrl: https://metrics-qa.example.invalid/api/v1 # PLACEHOLDER: confirm endpoint, not inferred from Loki
          namespaceCredentials:
            ps-spoolers-smtp-data-producer:
              logsCredentialRef: qa-logs
              metricsCredentialRef: qa-metrics
      stable:
        displayName: stable (example - configure before use)
        clusterIdentity: ckp-stable-region.domain
        monitoring: # Metadata only; live monitoring adapters are not connected yet
          logsApiBaseUrl: https://logs.stable-domain/loki/api/v1
          metricsApiBaseUrl: https://metrics-stable.example.invalid/api/v1 # PLACEHOLDER: confirm endpoint, not inferred from Loki
          namespaceCredentials:
            ps-spoolers-smtp-data-producer:
              logsCredentialRef: stable-logs
              metricsCredentialRef: stable-metrics
      perf:
        displayName: perf (example - configure before use)
        clusterIdentity: ckp-perf-region.domain
        monitoring: # Metadata only; live monitoring adapters are not connected yet
          logsApiBaseUrl: https://logs.perf-domain/loki/api/v1
          metricsApiBaseUrl: https://metrics-perf.example.invalid/api/v1 # PLACEHOLDER: confirm endpoint, not inferred from Loki
          namespaceCredentials:
            ps-spoolers-smtp-data-producer:
              logsCredentialRef: perf-logs
              metricsCredentialRef: perf-metrics
      perf3:
        displayName: perf3 (example - configure before use)
        clusterIdentity: ckp-perf3-region.domain
        monitoring: # Metadata only; live monitoring adapters are not connected yet
          logsApiBaseUrl: https://logs.perf3-domain/loki/api/v1
          metricsApiBaseUrl: https://metrics-perf3.example.invalid/api/v1 # PLACEHOLDER: confirm endpoint, not inferred from Loki
          namespaceCredentials:
            ps-spoolers-smtp-data-producer:
              logsCredentialRef: perf3-logs
              metricsCredentialRef: perf3-metrics
    services:
      ps-spoolers-ps-load-gen:
        projectPath: projects/ps-spoolers-ps-load-gen
        dependencies: []
        deploymentDefaults:
          namespace: ps-spoolers-smtp-data-producer
          releaseName: ps-spoolers-load-gen
          valuesFiles: [ckp/helm/ps-spoolers-ps-load-gen/values.yaml]
        # Optional per-environment exceptions; otherwise deploymentDefaults apply.
        deploymentByEnvironment: {}
        # installationBindings omitted: real chart retrieval is not implemented yet
        allowedOverridePaths: [] # Confirm editable chart fields before allowing overrides
    imageSources: {} # Simulation-only versions; mocks supply these in simulation mode
    scenarios:
      baseline-example:
        displayName: Baseline (example - configure before use)
        revision: example-1
        allowedOverridePaths: []
        defaults:
          profilePath: ckp/helm/ps-spoolers-ps-load-gen/values.yaml
          note: Replace with approved load-profile fields; this is not an executable profile
  # Sanitized organization patterns, not verified destinations. No automatic requests.
  connection-defaults:
    artifactory:
      office:
        apiBaseUrl: https://artifactory.domain/artifactory/api/docker
        credentialRef: registry-reader
    secretServers:
      office-vault:
        apiBaseUrl: https://domain/SecretServer/api/v1
        authMode: portal
        tokenUrl: https://domain/SecretServer/oauth2/token
    credentials:
      registry-reader:
        provider: delinea
        secretServerRef: office-vault
        secretId: '12345' # EXAMPLE ONLY: replace with the approved registry secret ID
        usernameFieldSlug: username
        passwordFieldSlug: password
      sandbox-logs:
        provider: delinea
        secretServerRef: office-vault
        secretId: '20000' # EXAMPLE ONLY: replace for sandbox logs
        usernameFieldSlug: username
        passwordFieldSlug: password
      sandbox-metrics:
        provider: delinea
        secretServerRef: office-vault
        secretId: '20001' # EXAMPLE ONLY: replace for sandbox metrics
        usernameFieldSlug: username
        passwordFieldSlug: password
      dev-logs:
        provider: delinea
        secretServerRef: office-vault
        secretId: '20002' # EXAMPLE ONLY: replace for dev logs
        usernameFieldSlug: username
        passwordFieldSlug: password
      dev-metrics:
        provider: delinea
        secretServerRef: office-vault
        secretId: '20003' # EXAMPLE ONLY: replace for dev metrics
        usernameFieldSlug: username
        passwordFieldSlug: password
      qa-logs:
        provider: delinea
        secretServerRef: office-vault
        secretId: '20004' # EXAMPLE ONLY: replace for qa logs
        usernameFieldSlug: username
        passwordFieldSlug: password
      qa-metrics:
        provider: delinea
        secretServerRef: office-vault
        secretId: '20005' # EXAMPLE ONLY: replace for qa metrics
        usernameFieldSlug: username
        passwordFieldSlug: password
      stable-logs:
        provider: delinea
        secretServerRef: office-vault
        secretId: '20006' # EXAMPLE ONLY: replace for stable logs
        usernameFieldSlug: username
        passwordFieldSlug: password
      stable-metrics:
        provider: delinea
        secretServerRef: office-vault
        secretId: '20007' # EXAMPLE ONLY: replace for stable metrics
        usernameFieldSlug: username
        passwordFieldSlug: password
      perf-logs:
        provider: delinea
        secretServerRef: office-vault
        secretId: '20008' # EXAMPLE ONLY: replace for perf logs
        usernameFieldSlug: username
        passwordFieldSlug: password
      perf-metrics:
        provider: delinea
        secretServerRef: office-vault
        secretId: '20009' # EXAMPLE ONLY: replace for perf metrics
        usernameFieldSlug: username
        passwordFieldSlug: password
      perf3-logs:
        provider: delinea
        secretServerRef: office-vault
        secretId: '20010' # EXAMPLE ONLY: replace for perf3 logs
        usernameFieldSlug: username
        passwordFieldSlug: password
      perf3-metrics:
        provider: delinea
        secretServerRef: office-vault
        secretId: '20011' # EXAMPLE ONLY: replace for perf3 metrics
        usernameFieldSlug: username
        passwordFieldSlug: password
    imageSources:
      office-dev:
        displayName: Dev images (example - configure before use)
        connectionRef: office
        repositoryKey: REPLACE_WITH_DOCKER_REPOSITORY
        imagePaths:
          ps-spoolers-ps-load-gen: REPLACE_WITH_IMAGE_PATH
        usernameRequired: false
        pullRepositoryTemplate: artifactory.domain/{repositoryKey}/{image}
  configuration-file: data/configuration.json
  artifact-root: data/artifacts
  tick-ms: 1200
  worker-enabled: true

---
spring:
  config:
    activate:
      on-profile: real
  datasource:
    url: jdbc:h2:file:./data/real/orchestrator;DB_CLOSE_ON_EXIT=FALSE
orchestrator:
  catalog: '' # Use inline real catalog examples; no simulation fixtures
  configuration-file: data/real/configuration.json
  artifact-root: data/real/artifacts
  worker-enabled: false
