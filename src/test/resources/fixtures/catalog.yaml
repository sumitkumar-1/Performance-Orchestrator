{
  "environments": {
    "sandbox": {
      "displayName": "sandbox",
      "clusterIdentity": "test-cluster"
    },
    "dev": {
      "displayName": "dev",
      "clusterIdentity": "test-cluster"
    }
  },
  "services": {
    "auth-service": {
      "projectPath": "projects/auth-service",
      "deploymentByEnvironment": {
        "sandbox": {
          "namespace": "auth-service",
          "releaseName": "auth-service",
          "valuesFiles": [
            "ckp/values.yaml",
            "ckp/values-sandbox.yaml"
          ]
        },
        "dev": {
          "namespace": "auth-service",
          "releaseName": "auth-service",
          "valuesFiles": [
            "ckp/values.yaml",
            "ckp/values-dev.yaml"
          ]
        }
      }
    }
  },
  "scenarios": {
    "smoke": {
      "displayName": "HTTP smoke \u00b7 synthetic results",
      "revision": "test-v1",
      "allowedOverridePaths": [
        "scenario.name"
      ],
      "defaults": {
        "scenario": {
          "name": "smoke"
        }
      }
    }
  }
}
