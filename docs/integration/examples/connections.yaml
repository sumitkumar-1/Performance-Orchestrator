# Copy to ignored .local/connections.yaml and replace these organizational placeholders.
# Enable with --orchestrator.connections=.local/connections.yaml
# No passwords, tokens or secret contents belong in this file.
artifactory:
  primary:
    apiBaseUrl: https://jfrog.example.invalid/artifactory/api/docker
    credentialRef: jfrog-primary
  secondary:
    apiBaseUrl: https://another-jfrog.example.invalid/artifactory/api/docker
    credentialRef: jfrog-secondary
secretServers:
  organization:
    # Organization path supplied: /SecretServer/api/v1. Replace only the example host.
    apiBaseUrl: https://secrets.example.invalid/SecretServer/api/v1
    authMode: portal
    tokenUrl: https://secrets.example.invalid/SecretServer/oauth2/token
  # Alternative connection for a token provided by an init container on a shared volume.
  # This is token delivery only; tenant authorization/CKP deployment is not implemented.
  provisioned:
    apiBaseUrl: https://secrets.example.invalid/SecretServer/api/v1
    authMode: file
    bearerTokenFile: /var/run/secrets/perf-orchestrator/delinea-token
  # Environment mode is also supported (omit tokenUrl and bearerTokenFile):
  # environment-example:
  #   apiBaseUrl: https://secrets.example.invalid/SecretServer/api/v1
  #   authMode: environment
  #   bearerTokenEnvironmentVariable: DELINEA_ACCESS_TOKEN
credentials:
  # Named namespace credentials are reusable by future monitoring adapters.
  # These are example IDs, not configured organizational secrets.
  logs-service-a:
    provider: delinea
    secretServerRef: organization
    secretId: '12345'
    usernameFieldSlug: username
    passwordFieldSlug: password
  logs-service-b:
    provider: delinea
    secretServerRef: organization
    secretId: '12346'
    usernameFieldSlug: username
    passwordFieldSlug: password
  jfrog-primary:
    provider: delinea
    secretServerRef: organization
    secretId: '12345'
    usernameFieldSlug: username
    passwordFieldSlug: password
  jfrog-secondary:
    provider: environment
    usernameEnvironmentVariable: JFROG_SECONDARY_USERNAME
    passwordEnvironmentVariable: JFROG_SECONDARY_PASSWORD
imageSources:
  organization-dev:
    displayName: Organization dev
    connectionRef: primary
    repositoryKey: example-docker-dev
    imagePaths:
      auth-service: team/auth-service
      smtp-receiver: team/smtp-receiver
    usernameRequired: false
    pullRepositoryTemplate: jfrog.example.invalid/{repositoryKey}/{image}
  organization-release:
    displayName: Organization release
    connectionRef: secondary
    repositoryKey: example-docker-release
    imagePaths:
      auth-service: team/auth-service
      smtp-receiver: team/smtp-receiver
    usernameRequired: false
    pullRepositoryTemplate: another-jfrog.example.invalid/{repositoryKey}/{image}
  organization-user:
    displayName: User builds
    connectionRef: primary
    repositoryKey: example-docker-users
    imagePaths:
      auth-service: '{username}/auth-service'
    usernameRequired: true
    pullRepositoryTemplate: jfrog.example.invalid/{repositoryKey}/{image}
