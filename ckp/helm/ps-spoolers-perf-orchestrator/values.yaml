# simulation: mock workflows; real: live read-only connections, no execution yet.
mode: simulation
targetEnvironment: sandbox # Fixed instance environment in real mode
image:
  repository: "" # Required: approved registry/repository
  tag: "" # Required: version published by your build
  pullPolicy: IfNotPresent
imagePullSecrets: []
# This application version supports one process with file-based H2 persistence.
persistence:
  enabled: true
  existingClaim: ""
  storageClass: "" # Empty uses the cluster default
  size: 2Gi
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
# Bootstrap config only. Runtime editor changes persist under /app/data.
connections:
  artifactory:
    office:
      apiBaseUrl: https://artifactory.domain/artifactory/api/docker
      credentialRef: registry-reader
  secretServers:
    office-vault:
      apiBaseUrl: https://domain/SecretServer/api/v1
      authMode: portal
      tokenUrl: https://domain/SecretServer/oauth2/token
  credentials:
    registry-reader:
      provider: delinea
      secretServerRef: office-vault
      secretId: '12345' # EXAMPLE ONLY: replace with the approved registry secret ID
      usernameFieldSlug: username
      passwordFieldSlug: password
    sandbox-logs:
      provider: delinea
      secretServerRef: office-vault
      secretId: '20000' # EXAMPLE ONLY: replace for sandbox logs
      usernameFieldSlug: username
      passwordFieldSlug: password
    sandbox-metrics:
      provider: delinea
      secretServerRef: office-vault
      secretId: '20001' # EXAMPLE ONLY: replace for sandbox metrics
      usernameFieldSlug: username
      passwordFieldSlug: password
    dev-logs:
      provider: delinea
      secretServerRef: office-vault
      secretId: '20002' # EXAMPLE ONLY: replace for dev logs
      usernameFieldSlug: username
      passwordFieldSlug: password
    dev-metrics:
      provider: delinea
      secretServerRef: office-vault
      secretId: '20003' # EXAMPLE ONLY: replace for dev metrics
      usernameFieldSlug: username
      passwordFieldSlug: password
    qa-logs:
      provider: delinea
      secretServerRef: office-vault
      secretId: '20004' # EXAMPLE ONLY: replace for qa logs
      usernameFieldSlug: username
      passwordFieldSlug: password
    qa-metrics:
      provider: delinea
      secretServerRef: office-vault
      secretId: '20005' # EXAMPLE ONLY: replace for qa metrics
      usernameFieldSlug: username
      passwordFieldSlug: password
    stable-logs:
      provider: delinea
      secretServerRef: office-vault
      secretId: '20006' # EXAMPLE ONLY: replace for stable logs
      usernameFieldSlug: username
      passwordFieldSlug: password
    stable-metrics:
      provider: delinea
      secretServerRef: office-vault
      secretId: '20007' # EXAMPLE ONLY: replace for stable metrics
      usernameFieldSlug: username
      passwordFieldSlug: password
    perf-logs:
      provider: delinea
      secretServerRef: office-vault
      secretId: '20008' # EXAMPLE ONLY: replace for perf logs
      usernameFieldSlug: username
      passwordFieldSlug: password
    perf-metrics:
      provider: delinea
      secretServerRef: office-vault
      secretId: '20009' # EXAMPLE ONLY: replace for perf metrics
      usernameFieldSlug: username
      passwordFieldSlug: password
    perf3-logs:
      provider: delinea
      secretServerRef: office-vault
      secretId: '20010' # EXAMPLE ONLY: replace for perf3 logs
      usernameFieldSlug: username
      passwordFieldSlug: password
    perf3-metrics:
      provider: delinea
      secretServerRef: office-vault
      secretId: '20011' # EXAMPLE ONLY: replace for perf3 metrics
      usernameFieldSlug: username
      passwordFieldSlug: password
  imageSources:
    office-dev:
      displayName: Dev images (example - configure before use)
      connectionRef: office
      repositoryKey: REPLACE_WITH_DOCKER_REPOSITORY
      imagePaths:
        ps-spoolers-ps-load-gen: REPLACE_WITH_IMAGE_PATH
      usernameRequired: false
      pullRepositoryTemplate: artifactory.domain/{repositoryKey}/{image}
# Existing Kubernetes Secret with environment-variable keys; no values in this chart.
environmentSecret: ""
# Optional existing Secret containing a plain bearer token under key `token`.
# Refer to /var/run/secrets/delinea/token in a file-mode Secret Server connection.
tokenSecret: ""
# Shared network access is intentionally unavailable in this app version.
service:
  enabled: false
  port: 8080
ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecret: ""

# Additional Spring startup properties, rendered as /app/config/application.yaml.
# Mode, loopback address, port and mounted config paths are owned by the chart.
# Do not put secret values here; use environmentSecret or tokenSecret above.
application: {}

# Same structure as orchestrator.catalog-defaults in application.yaml (real mode).
# Supply approved environment/service/scenario mappings; no invented defaults.
catalog:
  # EXAMPLES: replace cluster/namespace/paths and limits before use.
  environments:
    sandbox:
      displayName: sandbox (example - configure before use)
      clusterIdentity: ckp-sandbox-region.domain
      monitoring: # Metadata only; live monitoring adapters are not connected yet
        logsApiBaseUrl: https://logs.sandbox-domain/loki/api/v1
        metricsApiBaseUrl: https://metrics-sandbox.example.invalid/api/v1 # PLACEHOLDER: confirm endpoint, not inferred from Loki
        namespaceCredentials:
          ps-spoolers-smtp-data-producer:
            logsCredentialRef: sandbox-logs
            metricsCredentialRef: sandbox-metrics
    dev:
      displayName: dev (example - configure before use)
      clusterIdentity: ckp-dev-region.domain
