# simulation: mock workflows; real: connections plus opt-in Helm execution.
mode: simulation
targetEnvironment: sandbox # Fixed instance environment in real mode
image:
  repository: "" # Required: approved registry/repository
  tag: "" # Required: version published by your build
  pullPolicy: IfNotPresent
imagePullSecrets: []
# This application version supports one process with file-based H2 persistence.
persistence:
  enabled: true
  existingClaim: ""
  storageClass: "" # Empty uses the cluster default
  size: 2Gi
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
# Bootstrap config only. Runtime editor changes persist under /app/data.
connections:
  loki:
    lower:
      apiBaseUrl: https://logs.dev-domain/loki/api/v1 # EXAMPLE shared lower environments
    higher:
      apiBaseUrl: https://logs.perf-domain/loki/api/v1 # EXAMPLE shared higher environments
  artifactory:
    office:
      apiBaseUrl: https://artifactory.domain/artifactory/api/docker
      authMode: token # Paste an access token in the connection session
  bitbucket:
    office-stash:
      apiBaseUrl: https://stash.domain.net/rest/api
      authMode: token
  secretServers:
    office-vault:
      apiBaseUrl: https://domain/SecretServer/api/v1
      authMode: interactive
      tokenUrl: https://domain/SecretServer/oauth2/token
  credentials:
    bitbucket-reader:
      provider: delinea
      secretServerRef: office-vault
      secretId: '12346' # EXAMPLE: replace with the approved Bitbucket secret ID
      tokenFieldSlug: token
    registry-reader:
      provider: delinea
      secretServerRef: office-vault
      secretId: '12345' # EXAMPLE ONLY: replace with the approved registry secret ID
      tokenFieldSlug: token
    sandbox-logs:
      provider: delinea
      secretServerRef: office-vault
      secretId: '20000' # EXAMPLE ONLY: replace for sandbox logs
      usernameFieldSlug: username
      passwordFieldSlug: password
    dev-logs:
      provider: delinea
      secretServerRef: office-vault
      secretId: '20002' # EXAMPLE ONLY: replace for dev logs
      usernameFieldSlug: username
      passwordFieldSlug: password
    qa-logs:
      provider: delinea
      secretServerRef: office-vault
      secretId: '20004' # EXAMPLE ONLY: replace for qa logs
      usernameFieldSlug: username
      passwordFieldSlug: password
    stable-logs:
      provider: delinea
      secretServerRef: office-vault
      secretId: '20006' # EXAMPLE ONLY: replace for stable logs
      usernameFieldSlug: username
      passwordFieldSlug: password
    perf-logs:
      provider: delinea
      secretServerRef: office-vault
      secretId: '20008' # EXAMPLE ONLY: replace for perf logs
      usernameFieldSlug: username
      passwordFieldSlug: password
    perf3-logs:
      provider: delinea
      secretServerRef: office-vault
      secretId: '20010' # EXAMPLE ONLY: replace for perf3 logs
      usernameFieldSlug: username
      passwordFieldSlug: password
  imageSources: {} # Legacy mappings remain importable; new mappings belong to services
# Existing Kubernetes Secret with environment-variable keys; no values in this chart.
environmentSecret: ""
# Optional existing Secret containing a plain bearer token under key `token`.
# Refer to /var/run/secrets/delinea/token in a file-mode Secret Server connection.
tokenSecret: ""
# Shared network access is intentionally unavailable in this app version.
service:
  enabled: false
  port: 8080
ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecret: ""

# Additional Spring startup properties, rendered as /app/config/application.yaml.
# Mode, loopback address, port and mounted config paths are owned by the chart.
# Do not put secret values here; use environmentSecret or tokenSecret above.
application:
  orchestrator:
    execution:
      enabled: false
      kube-context: in-cluster
      expected-api-server: https://kubernetes.default.svc
      workspace: /app/data/real/workspaces
      command-timeout-seconds: 300
      helm-repositories:
        helm-dev-virtual: https://artifactory.domain/artifactory/helm-dev-virtual
        helm-qa-virtual: https://artifactory.domain/artifactory/helm-qa-virtual
        helm-stable-virtual: https://artifactory.domain/artifactory/helm-stable-virtual
        helm-release-virtual: https://artifactory.domain/artifactory/helm-release-virtual
# Use an organization-approved account with permissions in each selected service namespace.
# Namespace creation and RBAC grants are deliberately not performed by the orchestrator.
serviceAccount:
  name: ''
  automountToken: false # Enable when execution uses in-cluster authentication


# Same structure as orchestrator.catalog-defaults in application.yaml (real mode).
# Supply approved environment/service/scenario mappings; no invented defaults.
catalog:
  # EXAMPLES: replace cluster/namespace/paths and limits before use.
  environments:
    sandbox:
      displayName: sandbox (example - configure before use)
      clusterIdentity: ckp-sandbox-region.domain
      monitoring:
        connectionRef: lower
    dev:
      displayName: dev (example - configure before use)
      clusterIdentity: ckp-dev-region.domain
      monitoring:
        connectionRef: lower
    qa:
      displayName: qa (example - configure before use)
      clusterIdentity: ckp-qa-region.domain
      monitoring:
        connectionRef: lower
    stable:
      displayName: stable (example - configure before use)
      clusterIdentity: ckp-stable-region.domain
      monitoring:
        connectionRef: higher
    perf:
      displayName: perf (example - configure before use)
      clusterIdentity: ckp-perf-region.domain
      monitoring:
        connectionRef: higher
    perf3:
      displayName: perf3 (example - configure before use)
      clusterIdentity: ckp-perf3-region.domain
      monitoring:
        connectionRef: higher
  services:
    ps-spoolers-ps-load-gen:
      projectPath: projects/ps-spoolers-ps-load-gen
      monitoringCredentials:
        sandbox: sandbox-logs
        dev: dev-logs
        qa: qa-logs
        stable: stable-logs
        perf: perf-logs
        perf3: perf3-logs
      containerImage:
        connectionRef: office
        repoStage: dev # Produces docker-dev; independent of deployment environment
        teamId: ps-spoolers
        imageName: ps-spoolers-ps-load-gen
      sourceProject:
        connectionRef: office-stash
        projectKey: SP
        repository: ps-spoolers-ps-load-gen
        revision: REPLACE_WITH_APPROVED_GIT_TAG
        chartPath: ckp/helm/ps-spoolers-ps-load-gen
      dependencies: []
      deploymentDefaults:
        namespace: ps-spoolers-smtp-data-producer
        releaseName: ps-spoolers-load-gen
        valuesFiles: [ckp/helm/ps-spoolers-ps-load-gen/values.yaml]
      # Optional per-environment exceptions; otherwise deploymentDefaults apply.
      deploymentByEnvironment: {}
      # installationBindings omitted: real chart retrieval is not implemented yet
      allowedOverridePaths: [] # Confirm editable chart fields before allowing overrides
  imageSources: {} # Simulation-only versions; mocks supply these in simulation mode
  scenarios:
    baseline-example:
      displayName: Baseline (example - configure before use)
      revision: example-1
      allowedOverridePaths: []
      defaults:
        profilePath: ckp/helm/ps-spoolers-ps-load-gen/values.yaml
        note: Replace with approved load-profile fields; this is not an executable profile
