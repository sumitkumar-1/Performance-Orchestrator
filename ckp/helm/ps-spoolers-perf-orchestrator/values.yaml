# simulation: mock workflows; real: live read-only connections, no execution yet.
mode: simulation
image:
  repository: "" # Required: approved registry/repository
  tag: "" # Required: version published by your build
  pullPolicy: IfNotPresent
imagePullSecrets: []
# This application version supports one process with file-based H2 persistence.
persistence:
  enabled: true
  existingClaim: ""
  storageClass: "" # Empty uses the cluster default
  size: 2Gi
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
# Bootstrap config only. Runtime editor changes persist under /app/data.
connections:
  artifactory:
    office:
      apiBaseUrl: https://artifactory.domain/artifactory/api/docker
      credentialRef: registry-reader
  secretServers:
    office-vault:
      apiBaseUrl: https://domain/SecretServer/api/v1
      authMode: portal
      tokenUrl: https://domain/SecretServer/oauth2/token
  credentials:
    registry-reader:
      provider: delinea
      secretServerRef: office-vault
      secretId: '12345' # EXAMPLE ONLY: replace with the approved registry secret ID
      usernameFieldSlug: username
      passwordFieldSlug: password
  imageSources: {} # Add exact repositoryKey/imagePaths mappings before discovery
# Existing Kubernetes Secret with environment-variable keys; no values in this chart.
environmentSecret: ""
# Optional existing Secret containing a plain bearer token under key `token`.
# Refer to /var/run/secrets/delinea/token in a file-mode Secret Server connection.
tokenSecret: ""
# Shared network access is intentionally unavailable in this app version.
service:
  enabled: false
  port: 8080
ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecret: ""

# Additional Spring startup properties, rendered as /app/config/application.yaml.
# Mode, loopback address, port and mounted config paths are owned by the chart.
# Do not put secret values here; use environmentSecret or tokenSecret above.
application: {}

# Same structure as orchestrator.catalog-defaults in application.yaml (real mode).
# Supply approved environment/service/scenario mappings; no invented defaults.
catalog:
  environments: {}
  services: {}
  imageSources: {}
  scenarios: {}
